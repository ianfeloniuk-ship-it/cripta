name: Cotações do exterior
on:
  schedule:
    - cron: '*/20 13-21 * * 1-5'   # a cada 20 min no pregão dos EUA (horário UTC)
    - cron: '30 22 * * 1-5'        # fechamento
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: cotacoes
  cancel-in-progress: true
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/cotacoes.py
      - name: Gravar se mudou
        run: |
          git config user.name "cripta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cotacoes.json
          git diff --cached --quiet || (git commit -m "cotações $(date -u +%F' '%H:%M)" && git push)
